name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Production dependencies only: dev/build tooling still carries the
      # unfixable `braces` advisory (no patched version exists).
      - run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.181.0
      # Explicit rulesets: `--config=auto` refuses to run with metrics off.
      - run: >
          semgrep scan --error --metrics=off
          --config p/typescript --config p/javascript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/secrets --config p/sql-injection
          --exclude node_modules --exclude .next

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # gitleaks scans only the commits in this push / pull request, so the key
      # already in history (rotate it) doesn't fail every run forever.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gitleaks can't tell a Supabase anon key (public by design) from the
      # service-role key (bypasses RLS); this decodes each JWT and checks.
      - run: node scripts/check-supabase-keys.mjs
